  sections:
    summary:
      - I am a Computer Scientist with a PhD co-funded by the University of Surrey and Imperial College London, specialising in Computational Biology and Neuro-Oncology, with core expertise in transforming complex, high-dimensional data into intuitive and visually compelling interactive formats. My analytical foundation was established during my Master's in Data Science at the University of Sydney, where I built rigorous competencies across Statistical Data Science, Machine Learning and Data Mining, Advanced Data Models, and Natural Language Processing — skills I have since carried directly into doctoral and postdoctoral research.
      - With over 7 years of industry experience spanning AI/ML research at Zhejiang University, data-driven project management for major telecommunications companies including China Mobile and China Unicom, and freelance web development, I bring a uniquely full-stack perspective to data science. I am proficient across Python (PyTorch, Scikit-learn), R (Seurat, SpatialExperiment), JavaScript (React, D3.js), and SQL/NoSQL, which I apply to build containerised bioinformatic workflows, custom spatial omics pipelines, and statistic-based clustering algorithms that automatically map immune niches in Glioblastoma tissue. Rather than delivering static, overwhelming outputs, I engineer bespoke web-based platforms that empower non-computational collaborators (such as pure neuroscientists) to dynamically explore and deeply understand complex biological and clinical results.
      - My philosophy of bridging rigorous mathematical modelling with interactive engineering was first forged during my Data Science Capstone Project and continues to drive every stage of my work today, from raw data processing to the final interactive visualisation.
    education:
      - institution: University of Surrey
        area: Computer Science
        degree: "PhD (Viva Passed: 2026-06)"
        start_date: 2022-10
        end_date: 2026-06
        location: Guildford, UK
        highlights:
          - 'Co-funded by the University of Surrey & Imperial College London.'
          - '**Algorithmic Leadership**: Developed a novel clustering algorithm
            utilising the Dirichlet Process to automatically determine optimal
            niches in spatial transcriptomic data'
          - '**GBM Spatial Analysis**: Lead analyst for GBM tissue cohorts in
