            GeoMx to deliver mechanistic insights into immune evasion'
          - '**Stakeholder Delivery**: Designed and deployed public-facing
            interactive web applications (HTML/Shiny) to visualise results for
            clinical collaborators and lab fundraisers'
          - '**Advanced Inference**: Performed cell-type deconvolution and
            transcription activity mapping to identify novel therapeutic targets
            in the GBM microenvironment'
          - '**Reproducibility**: Established and maintained robust,
            containerised (Docker) bioinformatic workflows for
