cv:
  # open https://rendercv.com/?billing=subscription for real-time rendering
  name: Huan Huang
  headline: Computer Scientist specializing in Data Analysis, Machine Learning, Interactive Visualisation and Data Management
  location: London, UK
  email: coolandhot2006@gmail.com
  phone: "+44 7536 231990"
  # photo:
  # website: https://coolandhot.github.io/
  social_networks:
    - network: GitHub
      username: CoolandHot
