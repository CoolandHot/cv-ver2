profile: |
   I am a Computer Scientist specialising in Computational Biology and Neuro-Oncology, 
   acting as a strategic bridge between advanced algorithmic development and clinical discovery. 
   With a PhD in CS and over 7 years of industry project management experience, I excel in 
   transforming complex, high-dimensional spatial omics data (e.g., 10X Visium HD, GeoMx) 
   into interpretable, interactive digital assets. My work focuses on uncovering immune 
   mechanisms in Glioblastoma (GBM) through bespoke clustering algorithms and deploying 
   "living results" via web-based platforms to drive both scientific insight and public fundraising impact.

