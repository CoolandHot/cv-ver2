  sections:
    summary:
      - I am a Computer Scientist specialising in Computational Biology and
        Neuro-Oncology, acting as a strategic bridge between advanced
        algorithmic development and clinical discovery. Recently passed my PhD Viva in June 2026. Currently on a student visa and seeking a part-time role that can start immediately. With over 7 years of industry project management experience, I
        excel in transforming complex, high-dimensional spatial omics data
        (e.g., 10X Visium HD, GeoMx) into interpretable, interactive digital
        assets. My work focuses on uncovering immune mechanisms in glioblastoma
        (GBM) through bespoke clustering algorithms and deploying "interactive
        results" via web-based platforms.
