  sections:
    summary:
      - I am an IT professional and Computer Scientist with a PhD co-funded by
        the University of Surrey and Imperial College London, combining deep
        technical expertise with extensive project management experience across
        major telecommunications organisations. I have a strong working
        knowledge of data governance frameworks, having handled sensitive
        clinical and genomic datasets under strict institutional ethical
        oversight throughout my doctoral research.
      - With over 7 years of industry experience including IT project management
        at China Mobile and China Unicom, where I led large-scale IT
        deployments for government institutions, hospitals, and schools. I have
        directly implemented data-handling policies, coordinated multi-disciplinary
        technical teams, and delivered staff training programmes on new IT
        systems. My doctoral work further deepened this governance mindset, where
        managing sensitive patient-level genomic data required rigorous data
        access controls, audit trails, reproducible and containerised
        workflows (Docker), and compliance with institutional data protection
        protocols.
      - I am now seeking to apply this combined expertise in this Data Protection Officer (IT), where I can bridge technical IT understanding with regulatory compliance to protect
        organisational information assets and build a culture of data privacy
        awareness. Noticing GDPR and data protection regulation as a
        key requirement for this role, I have proactively enrolled in an online
        GDPR and Data Protection certification course to formalise and
        consolidate my practical compliance experience within the appropriate
        regulatory framework.

