cv:
  # open https://rendercv.com/?billing=subscription for real-time rendering
  name: Huan Huang
  headline: Computer Scientist specializing in Computational Biology & Neuro-Oncology
  location: London, UK
  email: coolandhot2006@gmail.com
  phone: "+44 7536 231990"
  # photo:
  # website: https://coolandhot.github.io/
  social_networks:
    - network: GitHub
      username: CoolandHot
  custom_connections:
  sections:
    summary:
      - I am a Full-Stack Web Developer and Computer Scientist with a PhD co-funded by the University of Surrey and Imperial College London, bringing a rare combination of rigorous scientific thinking and end-to-end engineering capability. With over 7 years of professional experience spanning AI/ML research, large-scale IT project management at major telecommunications companies including China Mobile and China Unicom, and freelance web development for small business owners, I have consistently delivered robust, scalable, and user-centred digital solutions across diverse and demanding environments.
      - My technical stack spans the full development lifecycle — from crafting responsive, data-driven front-ends using React.js and D3.js, to building and maintaining back-end services and RESTful APIs, containerised workflows, and both SQL and NoSQL database architectures. I am equally fluent in Python, R, and JavaScript, and have hands-on experience deploying applications in remote and cloud-based development environments. A defining strength of my work is translating highly complex, high-dimensional data — such as spatial omics datasets — into clean, interactive, and accessible web interfaces that serve non-technical end users, demonstrating my ability to bridge the gap between sophisticated back-end logic and intuitive front-end experience.
      - My approach to web development is rooted in a philosophy forged during my Data Science Capstone Project and refined through years of research engineering: that the most impactful digital products are those that make the complex feel effortless. Whether architecting a full-stack application from scratch, optimising data pipelines, or designing interactive visualisation dashboards, I bring the same discipline, curiosity, and attention to detail that defines both great science and great software.
    education:
      - institution: University of Surrey
        area: Computer Science
        degree: "PhD (Viva Passed: 2026-06)"
        start_date: 2022-10
        end_date: 2026-06
        location: Guildford, UK
        highlights:
          - 'Co-funded by the University of Surrey & Imperial College London.'
          - '**Algorithmic Leadership**: Developed a novel clustering algorithm
            utilising the Dirichlet Process to automatically determine optimal
            niches in spatial transcriptomic data'
          - '**GBM Spatial Analysis**: Lead analyst for GBM tissue cohorts in
            the Department of Surgery and Cancer, utilising 10X Visium HD and
            GeoMx to deliver mechanistic insights into immune evasion'
          - '**Stakeholder Delivery**: Designed and deployed public-facing
            interactive web applications (HTML/Shiny) to visualise results for
            clinical collaborators and lab fundraisers'
          - '**Advanced Inference**: Performed cell-type deconvolution and
            transcription activity mapping to identify novel therapeutic targets
            in the GBM microenvironment'
          - '**Reproducibility**: Established and maintained robust,
            containerised (Docker) bioinformatic workflows for
            high-plex spatial data in remote development environments'
